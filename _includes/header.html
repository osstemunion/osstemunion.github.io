<header class="site-header">
  <div class="wrap header-row">
    <a class="brand" href="{{ '/' | relative_url }}">
      <img class="brand-logo" src="{{ '/images/logos/kmwu.png' | relative_url }}" alt="전국금속노동조합 로고" width="178" height="156">
      <span class="brand-text"><small>민주노총 전국금속노동조합</small>오스템임플란트지회</span>
      <span class="brand-divider" aria-hidden="true"></span>
      <img class="brand-company" src="{{ '/images/logos/osstem.png' | relative_url }}" alt="오스템임플란트" width="311" height="117">
    </a>
    <a class="header-cta" href="{{ site.data.links.join_form.url }}" target="_blank" rel="noopener">가입하기</a>
  </div>
  <nav class="site-nav" aria-label="주 메뉴">
    <div class="wrap">
      <a href="{{ '/about.html' | relative_url }}"{% if page.nav == 'about' %} aria-current="page"{% endif %}>노조소개</a>
      <a href="{{ '/news.html' | relative_url }}"{% if page.nav == 'news' %} aria-current="page"{% endif %}>노조소식</a>
      <a href="{{ '/library.html' | relative_url }}"{% if page.nav == 'library' %} aria-current="page"{% endif %}>자료실</a>
      <a href="{{ '/faq.html' | relative_url }}"{% if page.nav == 'faq' %} aria-current="page"{% endif %}>FAQ</a>
      <a href="{{ '/join.html' | relative_url }}"{% if page.nav == 'join' %} aria-current="page"{% endif %}>가입·상담</a>
    </div>
  </nav>
</header>
