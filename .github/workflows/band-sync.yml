# 밴드 본문에 #홈페이지 가 있는 글을 매일 노조소식으로 가져옵니다.
# 수동 실행: 저장소 Actions 탭 → "밴드 → 노조소식 가져오기" → Run workflow
name: 밴드 → 노조소식 가져오기

on:
  schedule:
    - cron: "17 23 * * *"   # 매일 오전 8시 17분 (한국시간)
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: band-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 밴드에서 #홈페이지 글 가져오기
        env:
          BAND_ACCESS_TOKEN: ${{ secrets.BAND_ACCESS_TOKEN }}
          BAND_KEY: ${{ secrets.BAND_KEY }}
        run: python tools/band_sync.py

      - name: 새 글을 홈페이지에 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "새 글 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _posts images/band
          git commit -m "밴드 #홈페이지 글 가져오기"
          git push
          # 자동으로 올린 변경에도 홈페이지가 다시 만들어지도록 요청합니다.
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds" || true
