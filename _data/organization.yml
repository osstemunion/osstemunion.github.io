# 조직도 — 지회 규칙(2026.8.25 설립총회 제정) 기준
parent: 전국금속노동조합 서울지부

# 지금 지회를 누가 운영하는지 알리는 문구
status: 대의원들이 함께 이끄는 집단지도체제로 지회를 운영하고 있습니다. 임원 선거로 지회장 등 임원이 선출되면 이곳에 안내합니다.

# 의결·집행·감사 기구 (위에서부터 높은 순서)
bodies:
  - name: 총회
    group: 의결
    who: 조합원 전원
    role: 지회의 최고의결기관입니다. 임원 선출, 규칙 제정과 개정, 쟁의행위와 잠정합의안 가결을 결정합니다.
  - name: 대의원회의
    group: 의결
    who: 조합원이 직접·비밀·무기명 투표로 뽑은 대의원 (조합원 20명당 1명)
    role: 사업계획, 예산과 결산, 단체교섭과 쟁의 대책을 정하고 감사위원을 선출합니다.
  - name: 운영위원회
    group: 의결
    who: 임원과 대의원회의에서 뽑은 위원 (10명 이내)
    role: 총회와 대의원회의가 맡긴 일을 처리하고, 세칙 제정과 노사협의회 위원 선출 등을 결정합니다.
  - name: 집행위원회
    group: 집행
    who: 임원(감사위원 제외)과 지회장이 임명하는 부서장
    role: 회의에서 결정한 사항을 실행하고, 회의 안건과 지회의 일상 업무를 맡습니다.
  - name: 감사위원회
    group: 감사
    who: 대의원회의에서 선출한 감사위원
    role: 지회의 재산, 조합비, 업무 집행을 분기마다 감사하고 대의원회의에 결산을 보고합니다.
  - name: 선거관리위원회
    group: 감사
    who: 선거 때 구성
    role: 임원과 대의원 선거를 공정하게 관리합니다.

# 임원 — 선출되면 name 칸에 이름을 적으세요.
officers:
  - role: 지회장
    name: 임원 선거 후 공개
    duty: 지회를 대표하고 업무를 총괄합니다. 회의를 소집하고 의장을 맡으며 재정 집행을 책임집니다.
  - role: 부지회장
    name: 임원 선거 후 공개
    duty: 지회장을 보좌하고, 지회장이 자리를 비우면 그 임무를 대신합니다.
  - role: 사무장
    name: 임원 선거 후 공개
    duty: 지회 업무 전반을 관장하고 예산 집행과 회의 자료를 맡습니다.
  - role: 감사위원
    name: 임원 선거 후 공개
    duty: 재산과 조합비, 업무 집행을 감사합니다. 조합원·대의원 3분의 1 이상이 요청하면 바로 감사합니다.
