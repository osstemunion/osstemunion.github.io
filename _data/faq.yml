# 자주 묻는 질문 — 분류(groups) 안에 질문(items)을 추가하세요.
# 답변(a)은 일반 문장으로 쓰면 되고, 빈 줄로 문단을 나눕니다.
groups:
  - name: 가입과 보호
    items:
      - q: 노동조합에 왜 가입해야 하나요?
        a: |
          근로기준법처럼 노동자의 권리를 보장하는 법이 있어도, 현장에서 요구하지 않으면 지켜지지 않는 경우가 많습니다. 예를 들어 주말근로에는 추가수당을 줘야 하지만, 분위기상 개인이 요구하기 어려울 때가 있습니다.

          노동조합은 개인으로는 약자일 수밖에 없는 노동자들이 함께 모여 권리를 요구하는 곳입니다. 법을 지키게 하는 것을 넘어 더 나은 노동조건과 임금인상을 만들어냅니다. 노동조합의 결성과 활동은 헌법이 보장합니다.
      - q: 노사협의회만으로도 충분하지 않나요?
        a: |
          노사협의회는 '협의'하는 기구이고, 노동조합은 '합의'하는 기구입니다. 지키지 않아도 되는 협의보다 반드시 지켜야 하는 합의가 확실합니다.

          노사협의회에서는 회사가 거부해도 단체행동을 할 수 없습니다. 파업 등 쟁의행위는 노동조합만 합법적으로 할 수 있고, 그래서 헌법이 노동조합의 단체행동권을 보장합니다.
      - q: 노조에 가입하면 회사에서 불이익을 주지 않을까요?
        a: |
          노조 활동을 이유로 불이익을 주거나 가입과 활동을 방해하면 노조법상 부당노동행위로 처벌받습니다(2년 이하의 징역 또는 2천만 원 이하의 벌금).

          노동조합은 조합원이 부당한 일을 당하지 않도록 적극 대응합니다. 조합원이 많을수록 회사는 부당노동행위를 할 엄두를 내지 못합니다.
      - q: 회사가 제 가입 여부를 알 수 있나요?
        a: |
          앞으로 단체교섭을 거쳐 조합비를 급여에서 공제하게 되면 회사가 조합원을 알 수 있습니다. 다만 그 단계에 이르면 노조가 충분히 자리 잡은 뒤이므로 걱정하지 않으셔도 됩니다.
      - q: 팀장이나 지점장도 가입할 수 있나요?
        a: |
          대표, 임원, 이사처럼 실질적인 인사권과 임금 결정권을 가진 사람을 빼고는 모든 직원이 가입할 수 있습니다. 팀장도 가입할 수 있고, 인사팀 소속이라도 실무를 맡은 직원이면 가입할 수 있습니다.

          가입 대상은 노동조합법 제2조 제1호의 근로자로, '사용자 또는 항상 그의 이익을 대표하여 행동하는 자'에 해당하지 않는 범위에서 규약으로 정합니다.
      - q: 무급휴직 또는 병가 중에도 가입할 수 있나요?
        a: |
          네, 가입할 수 있습니다. 휴직자의 조합비는 휴직 기간에 월 3,000원입니다.
      - q: 가입은 언제 해도 괜찮은가요?
        a: |
          노동조합의 힘은 조합원 숫자에서 나옵니다. 가입자가 적으면 회사는 노조를 가볍게 여기고, 많을수록 노조의 요구를 무겁게 받아들입니다. 변화를 바란다면 지금 함께해 주세요.

  - name: 괴롭힘·부당대우 대응
    items:
      - q: 직장 내 괴롭힘을 당하고 있어요. 어떻게 대응해야 하나요?
        a: |
          **1. 기록부터 남기세요.** 날짜, 시간, 장소, 들은 말과 당한 행동, 함께 본 사람을 그때그때 적어 두세요. 메신저, 메일, 문자, 본인이 참여한 대화 녹음 같은 자료는 원본 그대로 회사 PC가 아닌 개인 저장소에 보관하세요.

          **2. 노조에 먼저 알려주세요.** 혼자 회사에 대응하기 전에 상담·제보 오픈채팅으로 상황을 알려주시면 노조가 대응 방법을 함께 정합니다.

          **3. 회사에 신고할 수 있습니다.** 회사는 신고를 받거나 괴롭힘을 알게 되면 지체 없이 객관적으로 조사하고, 조사 기간에도 피해자를 보호하는 조치를 해야 합니다(근로기준법 제76조의3).

          **4. 신고했다고 불이익을 주면 처벌받습니다.** 신고자나 피해자에게 해고, 전보, 업무 배제 같은 불리한 처우를 하면 3년 이하의 징역 또는 3천만 원 이하의 벌금에 처해질 수 있습니다.

          **5. 회사가 움직이지 않으면 노동청에 진정하세요.** 회사가 조사를 하지 않거나 조사가 명백히 불공정하면 관할 지방고용노동청에 진정할 수 있고, 이 경우 근로감독관이 직접 조사할 수 있습니다.
      - q: 회사가 노무사를 소개해 준다는데, 그 노무사와 상담해도 되나요?
        a: |
          주의하세요. 회사가 소개하거나 위촉한 노무사는 회사와 계약한 사람으로, 피해자인 여러분을 대리하는 사람이 아닙니다. 그 노무사와의 상담이나 조사에만 기대면 괴롭힘을 제대로 인정받기 어렵습니다.

          회사 측 노무사에게 진술하기 전에 반드시 노조와 먼저 상담하세요. 필요하면 노조가 피해자 편에서 도울 외부 노무사를 연결해 드립니다.

  - name: 조합비
    items:
      - q: 조합비는 얼마인가요?
        calculator: true   # 답변 아래에 조합비 계산기를 붙입니다
        a: |
          금속노조 규약은 통상임금의 1%를 조합비로 정하고 있습니다. 통상임금에는 대략 기본급, 고정 수당, 고정 상여금이 들어갑니다.
      - q: 조합비는 어디에 쓰이고, 내역은 어떻게 확인하나요?
        a: |
          조합비는 조직, 교육, 홍보, 정책 개발, 회의, 투쟁 등에 쓰입니다. 예를 들어 간담회 장소 대관비, 자료 제작비, 참가자 식대 등입니다.

          대의원회의에서 선출한 감사위원이 분기마다 회계와 업무를 감사하고, 그 결과와 결산 내역을 대의원회의에 보고합니다.

  - name: 참여
    items:
      - q: 노조 운영에 직접 참여하고 싶어요.
        a: |
          집행부로 참여하실 수 있습니다. 동료 의견 모으기, 소식지 만들기, 조합비 관리 등 노조 운영에 필요한 일을 함께 기획하고 추진합니다. 상담·제보 오픈채팅으로 알려주세요.
