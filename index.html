<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오스템임플란트 노동조합</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Malgun Gothic',sans-serif;
    background:#f4f7fb;
    color:#333;
    line-height:1.6;
}

/* ===== 상단 배너 ===== */

header{
    background:linear-gradient(135deg,#005BAA,#007BDB);
    color:white;
    text-align:center;
    padding:70px 20px;
}
.hero{
    max-width:900px;
    margin:auto;
}

.subtitle{
    font-size:22px;
    margin:25px 0;
    line-height:1.8;
    opacity:.95;
}

.hero-buttons{
    display:flex;
    justify-content:center;
    gap:15px;
    flex-wrap:wrap;
    margin-top:35px;
}

.hero-btn{
    text-decoration:none;
    padding:16px 35px;
    border-radius:50px;
    font-weight:bold;
    transition:.3s;
}

.join{
    background:white;
    color:#005BAA;
}

.join:hover{
    transform:translateY(-3px);
}

.consult{
    border:2px solid white;
    color:white;
}

.consult:hover{
    background:white;
    color:#005BAA;
}

header h1{
    font-size:42px;
    margin-bottom:15px;
}

header p{
    font-size:20px;
    opacity:.95;
}

/* ===== 본문 ===== */

.container{
    max-width:1100px;
    margin:auto;
    padding:40px 20px;
}

/* ===== 카드 ===== */

.card{
    background:white;
    border-radius:20px;
    padding:35px;
    margin-bottom:30px;
    box-shadow:0 10px 25px rgba(0,0,0,.08);
}

.card h2{
    color:#005BAA;
    margin-bottom:15px;
}

/* ===== 버튼 ===== */

.button{
    display:block;
    text-align:center;
    width:100%;
    max-width:350px;
    margin:18px auto;
    padding:18px;
    border-radius:12px;
    text-decoration:none;
    font-size:18px;
    font-weight:bold;
    color:white;
    background:#005BAA;
    transition:.25s;
}

.button:hover{
    background:#003F78;
    transform:translateY(-2px);
}

/* ===== 푸터 ===== */

footer{
    background:#0f172a;
    color:white;
    text-align:center;
    padding:30px;
    margin-top:60px;
}

/* ===== 모바일 ===== */

    /* 빠른 메뉴 카드 */

.quick-menu{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
    margin:40px 0;
}


.menu-card{
    background:white;
    border-radius:20px;
    padding:30px 15px;
    text-align:center;
    box-shadow:0 8px 20px rgba(0,0,0,.08);
    transition:.3s;
}


.menu-card:hover{
    transform:translateY(-8px);
}


.icon{
    font-size:40px;
    margin-bottom:15px;
}


.menu-card h3{
    color:#005BAA;
    margin-bottom:10px;
}


.menu-card p{
    font-size:14px;
    color:#666;
}


/* 노조 가입 카드 강조 */

.join-card{
    background:#d9efff;
    border:2px solid #8bc9ff;
}


.join-card h3{
    color:#0066b3;
}


.join-card:hover{
    background:#dcefff;
}


/* 모바일에서는 2칸 */

@media(max-width:768px){

.quick-menu{
    grid-template-columns:repeat(2,1fr);
}

}
@media (max-width:768px){

header{
    padding:50px 20px;
}

header h1{
    font-size:28px;
}

header p{
    font-size:16px;
}

.card{
    padding:25px;
}

.button{
    font-size:17px;
}

}

</style>
</head>

<body>

<header>

<div class="hero">

<h1>🤝 오스템임플란트 노동조합</h1>

<p class="subtitle">
혼자가 아닌 함께,<br>
더 나은 일터를 만들어갑니다.
</p>

<div class="hero-buttons">

<a href="#" class="hero-btn join">
노조 가입하기
</a>

<a href="#" class="hero-btn consult">
노동 상담
</a>

</div>

</div>

</header>

<div class="container">

<div class="card">

<h2>환영합니다.</h2>

<p>

오스템임플란트 노동조합 홈페이지입니다.<br><br>

노동조합 가입, 노동상담, 공지사항 및 다양한 정보를
쉽고 빠르게 확인하실 수 있습니다.

</p>

</div>

<div class="quick-menu">

<div class="menu-card join-card">
<div class="icon">📝</div>
<h3>노조 가입</h3>
<p>가입 신청 및<br>관련 안내</p>
</div>


<div class="menu-card">
<div class="icon">💬</div>
<h3>노동 상담</h3>
<p>익명으로<br>편하게 상담하세요</p>
</div>


<div class="menu-card">
<div class="icon">📢</div>
<h3>공지사항</h3>
<p>노조의 새로운<br>소식을 확인하세요</p>
</div>


<div class="menu-card">
<div class="icon">👥</div>
<h3>조직도</h3>
<p>노동조합<br>구성을 확인하세요</p>
</div>


</div>

</div>

<footer>

© 2026 Osstem Implant Labor Union

</footer>

</body>
</html>
