<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오스템임플란트 노동조합</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Malgun Gothic',sans-serif;
    background:#f4f7fb;
    color:#333;
    line-height:1.6;
}

/* ===== 상단 배너 ===== */

header{
    background:linear-gradient(135deg,#005BAA,#007BDB);
    color:white;
    text-align:center;
    padding:70px 20px;
}

header h1{
    font-size:42px;
    margin-bottom:15px;
}

header p{
    font-size:20px;
    opacity:.95;
}

/* ===== 본문 ===== */

.container{
    max-width:1100px;
    margin:auto;
    padding:40px 20px;
}

/* ===== 카드 ===== */

.card{
    background:white;
    border-radius:20px;
    padding:35px;
    margin-bottom:30px;
    box-shadow:0 10px 25px rgba(0,0,0,.08);
}

.card h2{
    color:#005BAA;
    margin-bottom:15px;
}

/* ===== 버튼 ===== */

.button{
    display:block;
    text-align:center;
    width:100%;
    max-width:350px;
    margin:18px auto;
    padding:18px;
    border-radius:12px;
    text-decoration:none;
    font-size:18px;
    font-weight:bold;
    color:white;
    background:#005BAA;
    transition:.25s;
}

.button:hover{
    background:#003F78;
    transform:translateY(-2px);
}

/* ===== 푸터 ===== */

footer{
    background:#0f172a;
    color:white;
    text-align:center;
    padding:30px;
    margin-top:60px;
}

/* ===== 모바일 ===== */

@media (max-width:768px){

header{
    padding:50px 20px;
}

header h1{
    font-size:28px;
}

header p{
    font-size:16px;
}

.card{
    padding:25px;
}

.button{
    font-size:17px;
}

}

</style>
</head>

<body>

<header>

<h1>오스템임플란트 노동조합</h1>

<p>함께 만드는 더 나은 일터</p>

</header>

<div class="container">

<div class="card">

<h2>환영합니다.</h2>

<p>

오스템임플란트 노동조합 홈페이지입니다.<br><br>

노동조합 가입, 노동상담, 공지사항 및 다양한 정보를
쉽고 빠르게 확인하실 수 있습니다.

</p>

</div>

<a href="#" class="button">노조 가입하기</a>

<a href="#" class="button">실시간 익명 상담</a>

</div>

<footer>

© 2026 Osstem Implant Labor Union

</footer>

</body>
</html>
